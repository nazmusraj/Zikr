name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and lint APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK 35
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and lint
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Nur-Zikr-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Nur-Zikr-test-APK
          path: dist/Nur-Zikr-test.apk
          if-no-files-found: error
          retention-days: 30
